{% extends 'layout.html' %}

{% block navbar %}
<!-- Custom navbar items -->
<li class="nav-item">
  <a id="navHome" class="nav-link" href="/">Home</a>
</li>
<li class="nav-item">
  <a id="navLogin" class="nav-link active" href="/login">LogIn</a>
</li>
<li class="nav-item">
  <a id="navSignUp" class="nav-link" href="/signUp">SignUp</a>
</li>
{% endblock %}

{% block body %}
<!-- Main content area -->
<div class="container">
  <div class="row justify-content-center">
      <div class="col-md-6">
          {% if error %}
          <!-- Display error message if login fails -->
          <div class="alert alert-danger text-center">
             {{ error }}
          </div>
          {% endif %}
          <div class="card mt-5" style="border: 20px solid #5cba00; border-radius: 8px;">
              <div class="card-body">
                  <h3 class="card-title text-center mb-4">Login</h3>
                  <form action="/authenticate" method="POST">
                      <div class="form-group">
                          <label for="username">Username:</label>
                          <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
                      </div>
                      <div class="form-group mt-3">
                          <label for="password">Password:</label>
                          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                      </div>
                      <div class="form-group mt-4">
                          <input class="btn btn-primary btn-block" type="submit" value="Login">
                      </div>
                  </form>
              </div>
          </div>
          <!-- Additional links for sign-up and password reset -->
          <div class="text-center mt-3">
              <a href="/signUp">Don't have an account? Sign up</a>
          </div>
          <div class="text-center mt-3">
              <a href="/resetPassword">Reset password</a>
          </div>
      </div>
  </div>
</div>
{% endblock %}
