{% extends 'layout.html' %}

{% block navbar %}
<!-- Custom navbar items -->
<li class="nav-item">
    <a id="navStaff" class="nav-link" href="/staff">Home</a>
</li>
<li class="nav-item">
    <a id="navAttendance" class="nav-link" href="/attendance/{{ id }}">Attendance</a>
</li>
<li class="nav-item">
    <a id="navJobHistory" class="nav-link" href="/jobHistory">Job History</a>
</li>
<li class="nav-item">
    <a id="navLogout" class="nav-link" href="/logout">LogOut</a>
</li>
{% endblock %}

{% block body %}
<head>
    <style>
        /* Custom page styling */
        .custom-container {
            background-color: #5cba00;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: black;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid white;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: gray;
            color: white;
            padding: 10px;
            font-weight: 600;
        }

        .green {
            background-color: green;
            color: white;
        }
        .red {
            background-color: red;
            color: white;
        }

        .d-flex {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<!-- Main content area -->
<div class="container mt-5 custom-container">
    <div class="card">
        <div class="card-body">
            <h2>Attendance for Last 30 Days</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Attendance</th>
                    </tr>
                </thead>
                <tbody>
                    {% for date, color in date_color %}
                    <tr>
                        <td>{{ date }}</td>
                        <td class="{{ color }}"></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
